<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign In | AURADECOR.ai</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            background:#050505;
            color:#fff;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .card {
            background:rgba(255,255,255,0.03);
            border:1px solid rgba(212,175,55,0.25);
            border-radius:24px;
            padding:40px 32px;
            width:100%;
            max-width:420px;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
        }
        h1 {
            font-size:24px;
            margin-bottom:8px;
            color:#D4AF37;
        }
        p.sub {
            font-size:14px;
            color:#aaa;
            margin-bottom:24px;
        }
        .field {
            margin-bottom:20px;
        }
        .field label {
            display:block;
            font-size:13px;
            margin-bottom:6px;
            color:#ddd;
        }
        .field input {
            width:100%;
            padding:12px 14px;
            border-radius:12px;
            border:1px solid rgba(212,175,55,0.3);
            background:rgba(0,0,0,0.6);
            color:#fff;
            font-size:14px;
        }
        .field input:focus {
            outline:none;
            border-color:#D4AF37;
            box-shadow:0 0 0 2px rgba(212,175,55,0.25);
        }
        .actions {
            margin-top:10px;
        }
        button {
            width:100%;
            padding:14px;
            border-radius:999px;
            border:none;
            background:linear-gradient(135deg,#D4AF37,#F1C40F);
            color:#000;
            font-weight:600;
            cursor:pointer;
            font-size:15px;
        }
        button:hover {
            box-shadow:0 16px 40px rgba(212,175,55,0.45);
            transform:translateY(-1px);
        }
        .link-row {
            margin-top:18px;
            font-size:13px;
            color:#bbb;
            text-align:center;
        }
        .link-row a {
            color:#D4AF37;
            text-decoration:none;
            font-weight:500;
        }
        .top-link {
            position:fixed;
            top:20px;
            left:30px;
            font-size:13px;
        }
        .top-link a {
            color:#D4AF37;
            text-decoration:none;
        }
    </style>
</head>
<body>
    <div class="top-link"><a href="/">← Back to Home</a></div>
    <div class="card">
        <h1>Welcome back</h1>
        <p class="sub">Sign in to manage your projects and designs.</p>

        <div style="margin-bottom: 18px;">
            <button type="button"
                    style="
                        width:100%;
                        padding:12px;
                        border-radius:999px;
                        border:1px solid rgba(212,175,55,0.4);
                        background:#111;
                        color:#fff;
                        font-weight:500;
                        font-size:14px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        gap:8px;
                        cursor:pointer;
                    "
                    onclick="window.location.href='/auth/google'">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                     alt="Google" style="width:18px;height:18px;">
                <span>Continue with Google</span>
            </button>
        </div>
        <div style="text-align:center;margin:12px 0 18px;color:#777;font-size:12px;">
            <span style="background:#050505;padding:0 8px;">or sign in with email</span>
            <hr style="border:none;border-top:1px solid #333;margin-top:-10px;">
        </div>

        <form action="/api/login" method="post">
            <div class="field">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" required placeholder="you@example.com">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required placeholder="••••••••">
            </div>
            <div class="actions">
                <button type="submit">Sign In</button>
            </div>
        </form>
        <div class="link-row">
            New to AURADECOR.ai?
            <a href="/register">Create an account</a>
        </div>
    </div>
</body>
</html>
